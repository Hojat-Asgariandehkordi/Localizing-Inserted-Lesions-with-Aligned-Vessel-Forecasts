   <g id="text_1">
    <text style="fill: #182934; font: 700 8.1px 'DejaVu Sans'; text-anchor: start" x="18.556524" y="34.179234" transform="rotate(-0 18.556524 34.179234)">01  /  Paired input</text>
   </g>
   <g id="text_2">
    <text style="fill: #182934; font: 7.5px 'DejaVu Sans'" transform="translate(18.556524 48.441928)">Control CT and lesion-added CT</text>
    <text style="fill: #182934; font: 7.5px 'DejaVu Sans'" transform="translate(18.556524 57.296194)">Share every exterior voxel</text>
   </g>
   <g id="text_3">
    <text style="fill: #067a64; font: 700 8.1px 'DejaVu Sans'; text-anchor: start" x="190.575" y="34.179234" transform="rotate(-0 190.575 34.179234)">02  /  Continue vessels</text>
   </g>
   <g id="text_4">
    <text style="fill: #182934; font: 7.5px 'DejaVu Sans'" transform="translate(190.575 48.441928)">Mask the inner 14 mm</text>
    <text style="fill: #182934; font: 7.5px 'DejaVu Sans'" transform="translate(190.575 57.296194)">Fit the same field from both legs</text>
   </g>
   <g id="text_5">
    <text style="fill: #182934; font: 700 8.1px 'DejaVu Sans'; text-anchor: start" x="366.263856" y="34.179234" transform="rotate(-0 366.263856 34.179234)">03  /  Search the core</text>
   </g>
   <g id="text_6">
    <text style="fill: #182934; font: 7.5px 'DejaVu Sans'" transform="translate(366.263856 48.441928)">10-mm search · 6-mm windows</text>
    <text style="fill: #182934; font: 7.5px 'DejaVu Sans'" transform="translate(366.263856 57.296194)">Three physical template radii</text>
   </g>
   <g id="text_7">
    <text style="fill: #182934; font: 700 8px 'DejaVu Sans'; text-anchor: start" x="9.013536" y="88.50905" transform="rotate(-0 9.013536 88.50905)">Use the same affine projection, normalization, and ridge-head budget</text>
   </g>
   <g id="text_8">
    <text style="fill: #626b76; font: 700 8.1px 'DejaVu Sans'; text-anchor: start" x="18.556524" y="114.565434" transform="rotate(-0 18.556524 114.565434)">CT only</text>
   </g>
   <g id="text_9">
    <!-- $g=0$ -->
    <g style="fill: #182934" transform="translate(18.556524 128.58555)">
     <text>
      <tspan style="font: oblique 7.2px 'DejaVu Sans'" x="0" y="-0.671875">g</tspan>
      <tspan style="font: 7.2px 'DejaVu Sans'" x="5.962677 13.385315" y="-0.671875">=0</tspan>
     </text>
    </g>
    <text style="fill: #182934; font: 7.2px 'DejaVu Sans'" transform="translate(18.556524 137.10027)">Score the affine residual</text>
   </g>
   <g id="text_10">
    <text style="fill: #126584; font: 700 8.1px 'DejaVu Sans'; text-anchor: start" x="142.370676" y="114.565434" transform="rotate(-0 142.370676 114.565434)">Fixed subtraction</text>
   </g>
   <g id="text_11">
    <!-- $g=1$ -->
    <g style="fill: #182934" transform="translate(142.370676 128.58555)">
     <text>
      <tspan style="font: oblique 7.2px 'DejaVu Sans'" x="0" y="-0.765625">g</tspan>
      <tspan style="font: 7.2px 'DejaVu Sans'" x="5.962677 13.385315" y="-0.765625">=1</tspan>
     </text>
    </g>
    <text style="fill: #182934; font: 7.2px 'DejaVu Sans'" transform="translate(142.370676 137.10027)">Use the exterior amplitude</text>
   </g>
   <g id="text_12">
    <text style="fill: #74539b; font: 700 8.1px 'DejaVu Sans'; text-anchor: start" x="266.184828" y="114.565434" transform="rotate(-0 266.184828 114.565434)">Plug-in residual</text>
   </g>
   <g id="text_13">
    <!-- $g=g_0$ -->
    <g style="fill: #182934" transform="translate(266.184828 128.58555)">
     <text>
      <tspan style="font: oblique 7.2px 'DejaVu Sans'" x="0 13.385315" y="-0.96875">gg</tspan>
      <tspan style="font: 7.2px 'DejaVu Sans'" x="5.962677" y="-0.96875">=</tspan>
      <tspan style="font: 5.04px 'DejaVu Sans'" x="17.947693" y="0.21250000000000036">0</tspan>
     </text>
    </g>
    <text style="fill: #182934; font: 7.2px 'DejaVu Sans'" transform="translate(266.184828 137.10027)">Fit the null gain once</text>
   </g>
   <g id="text_14">
    <text style="fill: #067a64; font: 700 8.1px 'DejaVu Sans'; text-anchor: start" x="389.99898" y="114.565434" transform="rotate(-0 389.99898 114.565434)">Joint profile</text>
   </g>
   <g id="text_15">
    <!-- $g=g(h)$ -->
    <g style="fill: #182934" transform="translate(389.99898 128.6013)">
     <text>
      <tspan style="font: oblique 7.2px 'DejaVu Sans'" x="0 13.385315 20.751801" y="-0.546875">ggh</tspan>
      <tspan style="font: 7.2px 'DejaVu Sans'" x="5.962677 17.947693 25.307159" y="-0.546875">=()</tspan>
     </text>
    </g>
    <text style="fill: #182934; font: 7.2px 'DejaVu Sans'" transform="translate(389.99898 137.11602)">Update gain with the lesion</text>
   </g>
   <g id="text_16">
    <text style="fill: #182934; font: 700 8px 'DejaVu Sans'; text-anchor: middle" x="250.769232" y="177.0406" transform="rotate(-0 250.769232 177.0406)">Shared decision head for crop acceptance    ·    Template maximum for the returned location</text>
   </g>
  </g>
 </g>
